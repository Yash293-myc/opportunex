steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/student-opportunity-matcher:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/student-opportunity-matcher:latest'
      - '.'
    id: 'Build'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/student-opportunity-matcher'
    id: 'Push'
    waitFor: ['Build']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'student-opportunity-matcher'
      - '--image=gcr.io/$PROJECT_ID/student-opportunity-matcher:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
    id: 'Deploy'
    waitFor: ['Push']

images:
  - 'gcr.io/$PROJECT_ID/student-opportunity-matcher:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/student-opportunity-matcher:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
